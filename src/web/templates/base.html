<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>{{ config.APP_NAME }}</h1>
                <p class="version">v{{ config.APP_VERSION }}</p>
            </div>
            <nav class="sidebar-nav">
                <a href="{{ url_for('index') }}" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
                    <span class="nav-icon">🏠</span>
                    <span class="nav-text">首页</span>
                </a>
                {% for tool in tools %}
                <a href="{{ url_for('tool_page', tool_name=tool.name) }}" 
                   class="nav-item {% if request.endpoint == 'tool_page' and request.view_args.get('tool_name') == tool.name %}active{% endif %}">
                    <span class="nav-icon">{{ tool.icon or '🔧' }}</span>
                    <span class="nav-text">{{ tool.display_name }}</span>
                </a>
                {% endfor %}
            </nav>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
